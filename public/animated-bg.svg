<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5e59" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d8573d" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="lineB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8942c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0f5e59" stop-opacity="0.28"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#182033" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#grid)"/>

  <g opacity="0.55" fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M-40 190 C180 90 320 340 520 250 C760 150 900 80 1240 140" stroke="url(#lineA)"/>
    <path d="M-60 580 C200 440 360 620 580 500 C820 360 980 560 1240 450" stroke="url(#lineB)"/>
  </g>

  <g font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f5e59" opacity="0.16">
    <text x="80" y="140">Route::get('/api')</text>
    <text x="820" y="230">return response()</text>
    <text x="200" y="680">Laravel</text>
    <text x="780" y="640">MySQL</text>
    <text x="540" y="120">REST API</text>
  </g>

  <g opacity="0.32">
    <rect x="140" y="260" width="150" height="56" rx="8" fill="#ffffff" stroke="#0f5e59" stroke-opacity="0.26"/>
    <rect x="900" y="360" width="170" height="60" rx="8" fill="#ffffff" stroke="#d8573d" stroke-opacity="0.22"/>
    <rect x="560" y="560" width="170" height="58" rx="8" fill="#ffffff" stroke="#c8942c" stroke-opacity="0.24"/>
  </g>

  <g fill="none" stroke="#182033" stroke-opacity="0.1" stroke-width="1.5">
    <rect x="120" y="420" width="140" height="70" rx="4"/>
    <rect x="860" y="140" width="180" height="80" rx="4"/>
    <rect x="420" y="420" width="190" height="95" rx="4"/>
  </g>
</svg>
